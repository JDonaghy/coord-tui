[package]
name = "coord-tui"
version = "0.1.0"
edition = "2021"
description = "TUI dashboard for claude-coordinator (quadraui-powered)"

[[bin]]
name = "coord-tui"
path = "src/main.rs"
required-features = ["tui"]

# GTK binary requires the `gtk` feature (builds a GTK4 desktop window).
# Build with: cargo build --features gtk --bin coord-tui-gtk
[[bin]]
name = "coord-tui-gtk"
path = "src/bin/gtk.rs"
required-features = ["gtk"]

# #1042: tui/tests/acceptance.rs is entirely `#![cfg(feature = "test-support")]`.
# Without this stanza, the configured Gate-A driver invocation (which never
# passes `--features test-support`; see docs/ORACLE_LOOP.md) silently compiles
# the target down to zero tests and reports a vacuous "0 passed" success.
# Pinning `required-features` here converts that into a loud build failure
# instead, forcing whoever owns the driver invocation to add the flag before
# Gate-A can even build.
[[test]]
name = "acceptance"
required-features = ["test-support"]

# #4: tests/gtk_cli.rs black-box-tests the coord-tui-gtk binary's
# `--version`/`-V` wiring, which only exists when the `gtk` feature is on
# (see the `[[bin]] coord-tui-gtk` stanza above). Without this, a plain
# `cargo test` (default features = ["tui"], no `gtk`) would fail to build
# the test at all, since `CARGO_BIN_EXE_coord-tui-gtk` wouldn't exist.
# Gating it here mirrors the `acceptance` stanza: skipped by default,
# picked up by `.github/workflows/cargo-test.yml`'s `cargo-test-gtk` job's
# `cargo test --features gtk`.
[[test]]
name = "gtk_cli"
required-features = ["gtk"]

[features]
default = ["tui"]

# Enables quadraui's ratatui/crossterm TUI backend and the coord-tui binary.
# Off this, the crate builds against no rasteriser backend at all — pair with
# `gtk` for a GTK-only build (`--no-default-features --features gtk`).
tui = ["quadraui/tui"]

# Enables the GTK4 backend in quadraui and the coord-tui-gtk binary.
# Requires GTK4 development libraries on the build host.
gtk = ["quadraui/gtk"]

# #1042: exposes `make_test_app` and sibling app-construction fixtures
# (`app::fixtures`, normally `#[cfg(test)]`-private) as `pub` at the crate
# root, so an external integration-test crate (`tui/tests/acceptance.rs`)
# can build a `CoordApp` from in-memory `BoardData` — no live daemon —
# exactly like the in-crate tests do. Off for a normal `cargo build`/
# `cargo test`; enable with `cargo test --features test-support`.
test-support = []

[dependencies]
# `terminal` enables quadraui's PTY + vt100 + scrollback engine
# (`quadraui::terminal_engine::TerminalSession`) so the Terminal panel
# (#424) can host a live shell inside the TUI. Always-on — the feature
# pulls in `portable-pty` + `vt100`, which are small native deps.
#
# #1973: pinned to a quadraui git rev (was a relative path, which built
# against whatever branch happened to be checked out in ~/src/quadraui —
# a quadraui merge could break coord-tui's build/merge with zero
# coord-tui commits). Bumping the rev is now a deliberate, reviewable
# coord-tui commit — see CLAUDE.md's "coord-tui depends on quadraui"
# entry for the bump procedure and for how to build against a local
# quadraui checkout during co-development (a one-line, opt-in
# `.cargo/config.toml` `paths` override — see
# `tui/cargo-config-local-quadraui.toml.example`).
quadraui = { git = "https://github.com/JDonaghy/quadraui", rev = "973956e46fb92259caa6f15d75edf8510892cd29", features = ["terminal"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
gethostname = "1.1"
ureq = "2"
